# Playwright against the Vercel preview for this PR.
#
# Secrets: none required.
#   - Auth is the default GITHUB_TOKEN, which polls GitHub Deployments that the
#     Vercel GitHub app already publishes (environment "Preview").
#   - No VERCEL_TOKEN. No protection-bypass secret — preview Deployment
#     Protection / SSO is off, so the preview URL is publicly reachable once
#     Ready.
#   - If previews are later re-protected, add VERCEL_AUTOMATION_BYPASS_SECRET
#     and pass it as vercel_protection_bypass_header on the wait action, plus
#     x-vercel-protection-bypass on Playwright requests.
#
# Local `npm test` / `test:only` are unchanged: they build (or assume ./out)
# and serve localhost. This workflow sets PREVIEW_URL so Playwright skips
# webServer and hits the live preview — including real 308s for /Products
# and /Tricks/Details/:id, which `npx serve` cannot emit.

name: Preview E2E

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: preview-e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: read
  statuses: read

jobs:
  e2e:
    name: Playwright vs Vercel preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Vercel deploys the PR head, not the merge commit github.sha is.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Wait for Vercel preview
        id: vercel
        # Official action: polls GitHub Deployments (no Vercel token).
        # Pin: vercel/wait-for-deployment-action@main as of 2026-05-21.
        uses: vercel/wait-for-deployment-action@0e2b0c5c5cce31f1648108aeec56467187aca037
        with:
          environment: preview
          timeout: 600
          # We only need the preview URL, not the dpl_ id parsed from the
          # "Vercel" commit-status dashboard link.
          require-deployment-id: "false"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright against the preview
        env:
          PREVIEW_URL: ${{ steps.vercel.outputs.deployment-url }}
          BASE_URL: ${{ steps.vercel.outputs.deployment-url }}
          CI: true
        run: npx playwright test

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
